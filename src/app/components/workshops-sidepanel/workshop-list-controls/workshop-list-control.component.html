<h3>Workshop Lists</h3>
<div
  cdkDropList
  class="category-list"
  (cdkDropListDropped)="onDrop($event)"
>
  @for (workshop of workshops(); track workshop) {
  <div
    cdkDrag
    class="category-item"
  >
    <div class="mat-list-item-content">
      <mat-icon>drag_indicator</mat-icon>
      <a
        class="category-link"
        [routerLink]="
          '../' +
          workshop.workshopDocumentGroupId +
          '/' +
          workshop.workshopDocuments[0]._id
        "
        routerLinkActive="workshop-menu-nav-item-selected"
      >
        {{ workshop.name | truncate : 18 : '...' }}
      </a>
      <div class="flex-spacer"></div>
      <a
        matIconButton
        class="edit-icon"
        [routerLink]="['../edit-workshop', workshop._id]"
        [attr.aria-label]="'Edit ' + workshop.name"
        ><mat-icon>edit</mat-icon></a
      >
      <button
        matIconButton
        type="button"
        class="delete-icon"
        [attr.aria-label]="'Delete ' + workshop.name"
        (click)="deleteWorkshop($event, workshop)"
        ><mat-icon>delete</mat-icon></button
      >
    </div>
  </div>
  }
</div>
